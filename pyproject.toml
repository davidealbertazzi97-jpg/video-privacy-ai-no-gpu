[project]
name = "video-privacy-studio"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
dependencies = [
  "fastapi==0.140.13",
  "python-multipart==0.0.32",
  "uvicorn==0.51.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv", ".tools", "bin"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.bandit]
# The launcher starts only fixed local commands with shell=False.
skips = ["B404", "B603"]
